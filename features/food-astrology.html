<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Astrology 🔮</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f1e8;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            color: #2d241e;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            text-align: center;
            padding: 45px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
        }

        .small-title {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #8a786b;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 42px;
            margin: 10px 0;
        }

        .subtitle {
            color: #6f6259;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        input[type="date"] {
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 14px 25px;
            background: #2d241e;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #514239;
        }

        #result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: #faf7f0;
            border-radius: 15px;
        }

        #emoji {
            font-size: 65px;
        }

        #food {
            font-size: 30px;
            margin: 15px 0;
        }

        #message {
            color: #65584f;
            line-height: 1.6;
            font-size: 16px;
        }

        footer {
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }
    </style>

    <style>
        :root { --cream: #fff7dc; --navy: #241746; --pink: #f45b91; --yellow: #ffd166; --orange: #f28c52; --mint: #bfe8d0; --lavender: #d8c9f4; --white: #fffdf8; }
        body { position: relative; overflow-x: hidden; font-family: "Trebuchet MS", "Gill Sans", sans-serif; background: var(--cream); color: var(--navy); }
        body::before, body::after { content: "✦"; position: fixed; z-index: -1; display: grid; place-items: center; width: 260px; height: 260px; border-radius: 50%; color: rgba(36, 23, 70, .35); font-size: 42px; }
        body::before { top: -95px; left: -85px; background: #f8b6cf; }
        body::after { right: -80px; bottom: -90px; background: var(--mint); }
        .container { position: relative; max-width: 780px; padding: clamp(36px, 6vw, 68px); background: var(--white); border: 4px solid var(--navy); border-radius: 34px; box-shadow: 10px 12px 0 var(--navy), 0 24px 45px rgba(36, 23, 70, .16); }
        .container::before { content: "✦  ✧  ✦"; position: absolute; top: 20px; right: 28px; color: var(--orange); font-size: 22px; letter-spacing: 8px; }
        .food-decor { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        .container > *:not(.food-decor) { position: relative; z-index: 1; }
        .food-float { position: absolute; z-index: 0; font-size: 30px; filter: drop-shadow(0 5px 3px rgba(36, 23, 70, .16)); animation: foodFloat 6s ease-in-out infinite; }
        .float-biryani { top: 22%; left: 5%; font-size: 32px; animation-delay: -1s; }
        .float-dosa { top: 38%; right: 4%; font-size: 34px; animation-delay: -3.2s; }
        .float-momo { bottom: 25%; left: 6%; font-size: 29px; animation-delay: -4.6s; }
        .float-pizza { bottom: 16%; right: 11%; font-size: 33px; animation-delay: -2.1s; }
        .float-maggi { top: 53%; left: 2%; font-size: 27px; animation-delay: -5.3s; }
        .float-samosa { top: 18%; right: 14%; font-size: 28px; animation-delay: -.3s; }
        .small-title { display: inline-block; margin-bottom: 20px; padding: 8px 14px; color: var(--navy); font-size: 11px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; background: var(--yellow); border: 3px solid var(--navy); border-radius: 999px; transform: rotate(2deg); }
        h1 { font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif; font-size: clamp(2.6rem, 7vw, 4.8rem); line-height: .95; letter-spacing: -2px; color: var(--navy); }
        .subtitle { color: #66587f; line-height: 1.65; }
        label { display: block; margin-bottom: 10px; font-weight: 900; letter-spacing: .5px; }
        input[type="date"] { width: min(100%, 280px); padding: 15px; color: var(--navy); font: inherit; font-weight: 700; background: var(--mint); border: 4px solid var(--navy); border-radius: 14px; outline: none; transition: box-shadow .18s ease, transform .18s ease; }
        input[type="date"]:focus { box-shadow: 5px 5px 0 var(--lavender); transform: translateY(-2px); }
        button { display: block; margin: 24px auto; padding: 16px 24px; color: var(--navy); font: 900 15px "Trebuchet MS", "Gill Sans", sans-serif; background: var(--pink); border: 4px solid var(--navy); border-radius: 16px; box-shadow: 5px 6px 0 var(--navy); cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
        button:hover { background: #ff77a7; transform: translate(-2px, -3px) rotate(-1deg); box-shadow: 7px 9px 0 var(--navy); }
        button:active { transform: translate(3px, 3px); box-shadow: 2px 3px 0 var(--navy); }
        #result { margin-top: 34px; padding: 34px 24px; background: var(--lavender); border: 4px solid var(--navy); border-radius: 24px; box-shadow: 6px 7px 0 var(--navy); }
        #emoji { font-size: 76px; filter: drop-shadow(4px 5px 0 var(--yellow)); }
        #food { color: var(--navy); font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif; font-size: clamp(2rem, 6vw, 3rem); }
        #message, footer { color: #66587f; line-height: 1.65; }
        @keyframes foodFloat { 0%, 100% { transform: translate(0, 0) rotate(-6deg); } 50% { transform: translate(9px, -14px) rotate(7deg); } }
        @media (max-width: 600px) { body { padding: 18px; } .container { box-shadow: 6px 7px 0 var(--navy); } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
</head>

<body>

    <div class="container">

        <div class="food-decor" aria-hidden="true">
            <span class="food-float float-biryani">🍛</span>
            <span class="food-float float-dosa">🥞</span>
            <span class="food-float float-momo">🥟</span>
            <span class="food-float float-pizza">🍕</span>
            <span class="food-float float-maggi">🍜</span>
            <span class="food-float float-samosa">🥟</span>
        </div>

        <div class="small-title">
            100% Unlicensed Food Predictions
        </div>

        <h1>Food Astrology 🔮</h1>

        <p class="subtitle">
            Your birthday determines your destiny. Unfortunately, your destiny is food.
        </p>

        <label for="birthday">
            Enter your date of birth:
        </label>

        <br><br>

        <input type="date" id="birthday">

        <button onclick="predictFood()">
            Reveal My Food Destiny ✨
        </button>


        <div id="result">

            <div id="emoji"></div>

            <h2 id="food"></h2>

            <p id="message"></p>

        </div>


        <footer>
            Scientifically unnecessary. Cosmically questionable. 🔮
        </footer>

    </div>


    <script>

        function predictFood() {

            const birthday =
                document.getElementById("birthday").value;


            if (birthday === "") {

                alert(
                    "Please enter your birthday. The universe needs some basic information."
                );

                return;
            }


            /*
                Convert the birthday text into a unique-ish number.

                Example:
                2005-06-15

                Every character contributes to the result,
                including the year, month and day.
            */

            let number = 0;

            for (let i = 0; i < birthday.length; i++) {

                number =
                    number + birthday.charCodeAt(i);

            }


            const foods = [

                {
                    name: "Biryani 🍛",
                    emoji: "🍛",
                    message:
                        "You are dramatic, complex and impossible to ignore. Your solution to most problems is biryani. Honestly, valid."
                },

                {
                    name: "Dosa 🥞",
                    emoji: "🥞",
                    message:
                        "You look calm and organised, but one bad day can turn you into a crispy emotional disaster."
                },

                {
                    name: "Idli 🍥",
                    emoji: "🍥",
                    message:
                        "Soft, peaceful and underestimated. You avoid unnecessary conflict and prefer your problems with sambar."
                },

                {
                    name: "Momos 🥟",
                    emoji: "🥟",
                    message:
                        "You are mysterious. Nobody knows exactly how many momos you can eat, including you."
                },

                {
                    name: "Pani Puri 🥣",
                    emoji: "🥣",
                    message:
                        "Chaos is your comfort zone. You make questionable decisions quickly and enjoy every second of them."
                },

                {
                    name: "Parotta 🫓",
                    emoji: "🫓",
                    message:
                        "You have layers. Nobody understands all of them, but everyone agrees you work better with curry."
                },

                {
                    name: "Maggi 🍜",
                    emoji: "🍜",
                    message:
                        "You believe every problem can be solved in two minutes. Reality has repeatedly disagreed."
                },

                {
                    name: "Samosa 🥟",
                    emoji: "🥟",
                    message:
                        "Crispy outside, questionable inside and somehow responsible for everyone's sudden hunger."
                },

                {
                    name: "Shawarma 🌯",
                    emoji: "🌯",
                    message:
                        "You are wrapped in mystery. Nobody knows what is going on inside, but somehow it works."
                },

                {
                    name: "Gulab Jamun 🍮",
                    emoji: "🍮",
                    message:
                        "You are sweet, dramatic and absolutely incapable of stopping at just one."
                },

                {
                    name: "Fried Rice 🍚",
                    emoji: "🍚",
                    message:
                        "You are adaptable. Throw you into any situation and somehow you will make something out of it."
                },

                {
                    name: "Pav Bhaji 🍞",
                    emoji: "🍞",
                    message:
                        "You bring unnecessary amounts of energy into every situation. Butter is basically your emotional support system."
                }

            ];


            const index =
                number % foods.length;


            const result =
                foods[index];


            document.getElementById("emoji").textContent =
                result.emoji;


            document.getElementById("food").textContent =
                "You are: " + result.name;


            document.getElementById("message").textContent =
                result.message;


            document.getElementById("result").style.display =
                "block";

        }

    </script>

</body>

</html>
