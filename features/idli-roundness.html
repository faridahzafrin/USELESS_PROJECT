<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Idli Roundness™</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            background: #f5f3ee;

            color: #222;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;

        }


        .container {

            width: 100%;

            max-width: 650px;

            background: white;

            padding: 50px;

            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);

            text-align: center;

        }


        .small-title {

            font-size: 12px;

            letter-spacing: 3px;

            text-transform: uppercase;

            color: #888;

            margin-bottom: 15px;

        }


        h1 {

            font-size: 45px;

            margin-bottom: 15px;

        }


        .subtitle {

            color: #666;

            font-size: 17px;

            line-height: 1.6;

            margin-bottom: 35px;

        }


        .upload-box {

            border: 2px dashed #ccc;

            border-radius: 15px;

            padding: 30px;

            margin-bottom: 25px;

        }


        .upload-box h3 {

            margin-bottom: 10px;

        }


        .upload-box p {

            color: #777;

            font-size: 14px;

            margin-bottom: 15px;

        }


        input[type="file"] {

            font-size: 14px;

        }


        #preview {

            width: 220px;

            height: 220px;

            object-fit: cover;

            border-radius: 50%;

            display: none;

            margin: 25px auto;

            border: 5px solid #f5f3ee;

        }


        button {

            background: #222;

            color: white;

            border: none;

            border-radius: 10px;

            padding: 14px 30px;

            font-size: 16px;

            cursor: pointer;

            transition: 0.3s;

        }


        button:hover {

            background: #444;

            transform: translateY(-2px);

        }


        .result {

            margin-top: 35px;

            padding: 30px;

            background: #f5f3ee;

            border-radius: 15px;

            display: none;

        }


        .result-title {

            font-size: 13px;

            letter-spacing: 2px;

            color: #777;

        }


        .score {

            font-size: 55px;

            font-weight: bold;

            margin: 10px 0;

        }


        .classification {

            font-size: 21px;

            font-weight: bold;

            margin-bottom: 12px;

        }


        .message {

            color: #666;

            line-height: 1.5;

        }


        footer {

            margin-top: 30px;

            font-size: 12px;

            color: #999;

        }

    </style>

    <style>
        :root { --cream: #fff7dc; --navy: #241746; --pink: #f45b91; --yellow: #ffd166; --orange: #f28c52; --mint: #bfe8d0; --lavender: #d8c9f4; --white: #fffdf8; }
        body { position: relative; overflow-x: hidden; font-family: "Trebuchet MS", "Gill Sans", sans-serif; background: var(--cream); color: var(--navy); }
        body::before, body::after { content: ""; position: fixed; z-index: -1; width: 230px; height: 230px; border-radius: 42% 58% 63% 37% / 45% 38% 62% 55%; opacity: .7; }
        body::before { top: -70px; left: -70px; background: #f8b6cf; transform: rotate(24deg); }
        body::after { right: -65px; bottom: -75px; background: var(--lavender); transform: rotate(-18deg); }
        .container { position: relative; overflow: hidden; max-width: 780px; padding: clamp(34px, 6vw, 68px); background: var(--white); border: 4px solid var(--navy); border-radius: 34px; box-shadow: 10px 12px 0 var(--navy), 0 24px 45px rgba(36, 23, 70, .16); }
        .container::before { content: "✦"; position: absolute; top: 18px; right: 28px; color: var(--orange); font-size: 34px; }
        .container::after { content: "LAB 01"; position: absolute; top: 24px; left: 30px; color: var(--pink); font-size: 10px; font-weight: 900; letter-spacing: 2px; }
        .small-title { display: inline-block; margin-bottom: 20px; padding: 8px 14px; color: var(--navy); font-size: 11px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; background: var(--yellow); border: 3px solid var(--navy); border-radius: 999px; transform: rotate(-2deg); }
        h1 { font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif; font-size: clamp(2.5rem, 7vw, 4.8rem); line-height: .95; letter-spacing: -2px; color: var(--navy); }
        .subtitle { color: #66587f; font-size: 17px; line-height: 1.65; }
        .upload-box { position: relative; margin-bottom: 25px; padding: 32px 24px; background: var(--mint); border: 4px dashed var(--navy); border-radius: 24px; box-shadow: 5px 6px 0 var(--navy); }
        .upload-box h3 { font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif; font-size: 24px; }
        .upload-box p { color: #66587f; }
        input[type="file"] { max-width: 100%; color: var(--navy); font-weight: 700; }
        input[type="file"]::file-selector-button { margin-right: 10px; padding: 10px 14px; color: var(--navy); font-weight: 900; background: var(--yellow); border: 3px solid var(--navy); border-radius: 12px; cursor: pointer; }
        #preview { border: 6px solid var(--navy); box-shadow: 6px 7px 0 var(--pink); }
        button { padding: 16px 26px; color: var(--navy); font-family: inherit; font-weight: 900; background: var(--pink); border: 4px solid var(--navy); border-radius: 16px; box-shadow: 5px 6px 0 var(--navy); transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
        button:hover { background: #ff77a7; transform: translate(-2px, -3px) rotate(-1deg); box-shadow: 7px 9px 0 var(--navy); }
        button:active { transform: translate(3px, 3px); box-shadow: 2px 3px 0 var(--navy); }
        .result { margin-top: 38px; padding: 32px 24px; background: var(--lavender); border: 4px solid var(--navy); border-radius: 24px; box-shadow: 6px 7px 0 var(--navy); }
        .result-title { color: var(--navy); font-weight: 900; }
        .score { color: var(--pink); font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif; font-size: clamp(4rem, 12vw, 6rem); line-height: 1; text-shadow: 3px 3px 0 var(--navy); }
        .classification { color: var(--navy); font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif; }
        .message, footer { color: #66587f; }
        @media (max-width: 600px) { body { padding: 18px; } .container { box-shadow: 6px 7px 0 var(--navy); } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>

</head>


<body>


    <div class="container">


        <div class="small-title">

            100% Unlicensed Idli Science

        </div>


        <h1>

            🍥 Idli Roundness™

        </h1>


        <p class="subtitle">

            Because some questions are simply too important

            to remain unanswered.

        </p>


        <div class="upload-box">


            <h3>

                Submit Your Idli

            </h3>


            <p>

                Upload an image for extremely serious analysis.

            </p>


            <input

                type="file"

                id="imageInput"

                accept="image/*"

            >


        </div>


        <img

            id="preview"

            alt="Uploaded idli"

        >


        <button onclick="analyzeIdli()">

            Analyze Idli

        </button>


        <div

            class="result"

            id="result"

        >


            <div class="result-title">

                ROUNDNESS SCORE

            </div>


            <div

                class="score"

                id="score"

            >

                0%

            </div>


            <div

                class="classification"

                id="classification"

            >

                -

            </div>


            <p

                class="message"

                id="message"

            >

                -

            </p>


        </div>


        <footer>

            Scientifically unnecessary. Emotionally essential. 🍥

        </footer>


    </div>



    <script>


        // Get the image upload element

        const imageInput =
            document.getElementById("imageInput");


        // Get the image preview element

        const preview =
            document.getElementById("preview");



        // Show uploaded image

        imageInput.addEventListener("change", function () {


            const file = this.files[0];


            if (file) {


                const imageURL =
                    URL.createObjectURL(file);


                preview.src = imageURL;


                preview.style.display = "block";


            }

        });



        // Main Idli Analysis Function

        function analyzeIdli() {


            const file =
                imageInput.files[0];


            // Check whether an image was uploaded

            if (!file) {


                alert(
                    "Please upload an idli first. 🍥"
                );


                return;

            }



            /*
                Fake Scientific Idli Analysis™

                The same image will always receive
                the same score.

                Math.random() is NOT used.
            */


            const imageIdentifier =
                file.name +
                file.size +
                file.lastModified;



            let hash = 0;



            // Create a number based on the image information

            for (
                let i = 0;
                i < imageIdentifier.length;
                i++
            ) {


                hash =
                    ((hash << 5) - hash) +
                    imageIdentifier.charCodeAt(i);


                hash =
                    hash | 0;

            }



            /*
                Convert the generated number
                into a percentage between 80 and 100.
            */

            const score =
                Math.abs(hash) % 21 + 80;



            let classification;

            let message;



            // 95% and above

            if (score >= 95) {


                classification =
                    "Perfectly Circular 🥇";


                message =
                    "An outstanding specimen. Geometry itself is impressed.";

            }



            // 90% to 94%

            else if (score >= 90) {


                classification =
                    "Acceptably Round 🥈";


                message =
                    "A respectable idli. Breakfast standards have been met.";

            }



            // Below 90%

            else {


                classification =
                    "🚨 THIS IS NOT AN IDLI 🚨";


                message =
                    "Our highly qualified breakfast department has determined that this object is suspicious. Please contact your nearest idli immediately.";

            }



            // Display score

            document.getElementById("score").textContent =
                score + "%";



            // Display classification

            document.getElementById("classification").textContent =
                classification;



            // Display message

            document.getElementById("message").textContent =
                message;



            // Show result box

            document.getElementById("result").style.display =
                "block";

        }


    </script>


</body>

</html>
